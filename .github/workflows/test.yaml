name: Test

on: [push]

jobs:
  Test:
    #где запускаем
    runs-on: ubuntu-latest
    #что делаем
    steps:
    #выкачиваем репозиторий
      - uses: actions/checkout@v5
    #настраиваем java
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: Xotabu4/selenoid-github-action@v2
    #запускаем тесты
      - run: chmod +x ./gradlew
      - run: ./gradlew clean test -Dselenide.remote=https://your.selenoid.com:4444/wd/hub
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Zulu_jdk/17.0.18-8/x64