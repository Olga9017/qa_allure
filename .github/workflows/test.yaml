name: Test

on: [push]

jobs:
  Test:
    #где запускаем
    runs-on: ubuntu-latest
    #что делаем
    steps:
    #выкачиваем репозиторий
      - uses: actions/checkout@v5
    #настраиваем java
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
    #запускаем тесты
      - run: ./gradlew clean test