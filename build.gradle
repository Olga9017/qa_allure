plugins {
    id 'java'
    id 'io.qameta.allure' version '3.0.1'
}

group = 'ru.olgapopova'
version = '1.0-SNAPSHOT'

allure {
    report {
        version.set("2.19.0")
    }
    adapter { // отвечает за появление папки build/allure-results
        aspectjWeaver.set(true)//Обработка анатации Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set("2.19.0") //версия интеграции фреймворка и Allure
            }
        }
    }
}
repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            'com.codeborne:selenide:6.15.0',
            'org.junit.jupiter:junit-jupiter:6.0.2',
            'io.qameta.allure:allure-selenide:2.32.0',
            'io.github.bonigarcia:webdrivermanager:6.3.1'


    )
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
}